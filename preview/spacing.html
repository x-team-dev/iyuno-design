<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:20px;background:var(--bg)} .row{display:flex;flex-direction:column;gap:8px} .bar{display:flex;align-items:center;gap:10px} .b{height:14px;background:var(--accent);border-radius:2px} .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);width:48px} .val{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}</style></head>
<body class="ds-root">
  <div class="row">
    <div class="bar"><span class="lbl">sp-1</span><span class="b" style="width:4px"></span><span class="val">4 px</span></div>
    <div class="bar"><span class="lbl">sp-2</span><span class="b" style="width:8px"></span><span class="val">8 px</span></div>
    <div class="bar"><span class="lbl">sp-3</span><span class="b" style="width:12px"></span><span class="val">12 px</span></div>
    <div class="bar"><span class="lbl">sp-4</span><span class="b" style="width:16px"></span><span class="val">16 px</span></div>
    <div class="bar"><span class="lbl">sp-6</span><span class="b" style="width:24px"></span><span class="val">24 px</span></div>
    <div class="bar"><span class="lbl">sp-8</span><span class="b" style="width:32px"></span><span class="val">32 px</span></div>
    <div class="bar"><span class="lbl">sp-12</span><span class="b" style="width:48px"></span><span class="val">48 px</span></div>
    <div class="bar"><span class="lbl">sp-16</span><span class="b" style="width:64px"></span><span class="val">64 px</span></div>
  </div>
</body></html>
