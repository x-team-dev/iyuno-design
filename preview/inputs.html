<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:24px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
  .lbl{font-family:var(--font-body);font-size:13px;color:var(--fg-2);font-weight:500;display:block;margin-bottom:6px}
  .inp{font-family:var(--font-body);font-size:14px;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:#fff;color:var(--fg);width:100%;box-sizing:border-box;outline:none;transition:all var(--d-fast) var(--ease)}
  .inp::placeholder{color:var(--fg-mute)}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px oklch(0.795 0.165 75 / 0.18)}
  .grp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row{display:flex;gap:8px;align-items:center}
  .chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);background:var(--accent);position:relative;flex-shrink:0}
  .chk::after{content:'';position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid var(--accent-fg);border-width:0 2px 2px 0;transform:rotate(45deg)}
</style></head>
<body class="ds-root">
  <div class="grp">
    <div><span class="lbl">Project name</span><input class="inp" placeholder="e.g. Squid Game S03"/></div>
    <div><span class="lbl">Source language</span><input class="inp" value="ko-KR" style="border-color:var(--accent);box-shadow:0 0 0 4px oklch(0.795 0.165 75 / 0.18)"/></div>
  </div>
  <div class="row"><div class="chk"></div><span class="lbl" style="margin:0">Generate SDH track</span></div>
</body></html>
