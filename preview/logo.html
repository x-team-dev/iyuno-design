<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:0; background:var(--bg); }
  .wrap { display:grid; grid-template-columns:1fr 1fr; height:150px; }
  .pane { display:flex; align-items:center; justify-content:center; }
  .light { background:var(--ink-50); }
  .dark  { background:var(--ink-950); }
  img { width:200px; height:auto; }
</style>
</head>
<body class="ds-root">
  <div class="wrap">
    <div class="pane light"><img src="../assets/iyuno-logo.svg" alt="Iyuno"/></div>
    <div class="pane dark"><img src="../assets/iyuno-logo-white.svg" alt="Iyuno"/></div>
  </div>
</body>
</html>
