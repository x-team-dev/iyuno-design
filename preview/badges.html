<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:24px;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .badge{font-family:var(--font-body);font-size:12px;font-weight:500;padding:4px 10px;border-radius:var(--r-md);display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
  .dot{width:6px;height:6px;border-radius:99px}
  .b-running{background:var(--info-bg);color:var(--info);border-color:oklch(0.85 0.05 230)}
  .b-done{background:var(--success-bg);color:var(--success);border-color:oklch(0.85 0.05 145)}
  .b-failed{background:var(--danger-bg);color:var(--danger);border-color:oklch(0.85 0.06 25)}
  .b-pending{background:var(--ink-100);color:var(--fg-2);border-color:var(--border-strong)}
  .b-review{background:var(--warning-bg);color:oklch(0.45 0.13 70);border-color:oklch(0.85 0.07 70)}
  .b-tag{background:var(--amber-50);color:var(--amber-900);border-color:var(--amber-200);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
</style></head>
<body class="ds-root">
  <span class="badge b-running"><span class="dot" style="background:var(--info)"></span>Running</span>
  <span class="badge b-done"><span class="dot" style="background:var(--success)"></span>Completed</span>
  <span class="badge b-failed"><span class="dot" style="background:var(--danger)"></span>Failed</span>
  <span class="badge b-pending"><span class="dot" style="background:var(--ink-500)"></span>Pending</span>
  <span class="badge b-review"><span class="dot" style="background:var(--warning)"></span>Awaiting review</span>
  <span class="badge b-tag">CMG · v2</span>
  <span class="badge b-tag">ko-KR → en-US</span>
</body></html>
