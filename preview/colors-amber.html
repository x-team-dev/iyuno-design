<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Amber scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin:0; padding:24px; background:var(--bg); }
  .row { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
  .sw { aspect-ratio: 1/1.1; border-radius:var(--r-md); padding:8px; display:flex; flex-direction:column; justify-content:flex-end; }
  .sw .n { font-family:var(--font-mono); font-size:11px; color:inherit; opacity:.85; }
  .sw .h { font-family:var(--font-mono); font-size:10px; opacity:.65; }
</style></head>
<body class="ds-root">
  <div class="row">
    <div class="sw" style="background:var(--amber-50); color:var(--ink-950)"><span class="n">50</span></div>
    <div class="sw" style="background:var(--amber-100); color:var(--ink-950)"><span class="n">100</span></div>
    <div class="sw" style="background:var(--amber-200); color:var(--ink-950)"><span class="n">200</span></div>
    <div class="sw" style="background:var(--amber-300); color:var(--ink-950)"><span class="n">300</span></div>
    <div class="sw" style="background:var(--amber-400); color:var(--ink-950)"><span class="n">400</span></div>
    <div class="sw" style="background:var(--amber-500); color:var(--ink-950); outline:2px solid var(--ink-950); outline-offset:-2px"><span class="n">500★</span><span class="h">#FFB549</span></div>
    <div class="sw" style="background:var(--amber-600); color:var(--ink-50)"><span class="n">600</span></div>
    <div class="sw" style="background:var(--amber-700); color:var(--ink-50)"><span class="n">700</span></div>
    <div class="sw" style="background:var(--amber-800); color:var(--ink-50)"><span class="n">800</span></div>
    <div class="sw" style="background:var(--amber-900); color:var(--ink-50)"><span class="n">900</span></div>
  </div>
</body></html>
