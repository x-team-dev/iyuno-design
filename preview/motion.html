<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Focus & motion</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:24px;background:var(--bg);display:flex;gap:24px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em}
  .btn{font-family:var(--font-body);font-weight:600;font-size:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 4px oklch(0.795 0.165 75 / 0.18);outline:none}
  .ease{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);background:var(--bg-elev);padding:8px 10px;border-radius:var(--r-md);border:1px solid var(--border)}
  .dot{width:14px;height:14px;background:var(--accent);border-radius:99px;animation:slide 2s var(--ease) infinite alternate}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(160px)}}
  .track{width:200px;height:14px;border-radius:99px;background:var(--ink-100);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 6px}
</style></head>
<body class="ds-root">
  <div class="col">
    <span class="lbl">FOCUS RING — soft amber halo</span>
    <button class="btn">Start a build</button>
  </div>
  <div class="col">
    <span class="lbl">EASING — cubic-bezier(0.32, 0.72, 0, 1)</span>
    <div class="track"><div class="dot"></div></div>
    <span class="ease">--ease · 220 ms default</span>
  </div>
</body></html>
