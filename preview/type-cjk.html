<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>CJK type</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:22px;background:var(--bg)} .row{padding:6px 0;border-bottom:1px solid var(--border)} .row:last-child{border-bottom:0} .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px} .kr{font-family:var(--font-cjk-kr);font-size:22px;color:var(--fg)} .jp{font-family:var(--font-cjk-jp);font-size:22px;color:var(--fg)}</style></head>
<body class="ds-root">
  <div class="row"><div class="lbl">한국어 · Pretendard</div><span class="kr">의미는 머무르고, 창의는 여행한다.</span></div>
  <div class="row"><div class="lbl">日本語 · Noto Sans JP</div><span class="jp">創造性は旅をし、意味はそのままに。</span></div>
</body></html>
